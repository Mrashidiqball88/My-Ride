kind = "mobile"
previewPath = "/myride-driver-mobile/"
title = "My Ride Driver"
description = "Native mobile companion for approved My Ride drivers. Keeps driver availability, GPS tracking, ride alerts, and connection recovery active using platform-managed background services."
version = "1.0.0"
id = "artifacts/myride-driver-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/myride-driver-mobile/" ]
localPort = 24305

[services.development]
run = "pnpm --filter @workspace/myride-driver-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myride-driver-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/myride-driver-mobile", "run", "serve" ]

[services.env]
PORT = "24305"
BASE_PATH = "/myride-driver-mobile/"
