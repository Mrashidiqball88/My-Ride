plugins {
    id "com.android.application"
}

def productionKeystorePath = System.getenv("MYRIDE_RELEASE_KEYSTORE")
def productionKeystorePassword = System.getenv("MYRIDE_RELEASE_KEYSTORE_PASSWORD")
def productionKeyAlias = System.getenv("MYRIDE_RELEASE_KEY_ALIAS")
def productionKeyPassword = System.getenv("MYRIDE_RELEASE_KEY_PASSWORD")
def localKeystorePath = providers.gradleProperty("myrideKeystore").orNull
def localKeystorePassword = providers.gradleProperty("myrideKeystorePassword").orNull
def localKeyAlias = providers.gradleProperty("myrideKeyAlias").orNull
def localKeyPassword = providers.gradleProperty("myrideKeyPassword").orNull
def hasProductionSigning = [
        productionKeystorePath,
        productionKeystorePassword,
        productionKeyAlias,
        productionKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "com.myride.wrapper"
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions += "app"

    productFlavors {
        customer {
            dimension "app"
            applicationId "com.myride.customer"
            resValue "string", "app_name", "My Ride - Customer"
            resValue "string", "production_url", "https://myride.duckdns.org/customer"
        }
        driver {
            dimension "app"
            applicationId "com.myride.driver"
            resValue "string", "app_name", "My Ride - Driver"
            resValue "string", "production_url", "https://myride.duckdns.org/driver"
        }
    }

    signingConfigs {
        if (hasProductionSigning) {
            production {
                storeFile file(productionKeystorePath)
                storePassword productionKeystorePassword
                keyAlias productionKeyAlias
                keyPassword productionKeyPassword
            }
        }
        if (localKeystorePath) {
            workspaceInstall {
                storeFile file(localKeystorePath)
                storePassword localKeystorePassword
                keyAlias localKeyAlias
                keyPassword localKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasProductionSigning) {
                signingConfig signingConfigs.production
            } else if (localKeystorePath) {
                signingConfig signingConfigs.workspaceInstall
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}